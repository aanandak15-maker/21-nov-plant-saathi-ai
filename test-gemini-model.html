<!DOCTYPE html>
<html>
<head>
    <title>Test Gemini Model</title>
</head>
<body>
    <h1>Gemini Model Test</h1>
    <button onclick="testModel()">Test API Call</button>
    <pre id="result"></pre>

    <script>
        async function testModel() {
            const apiKey = 'AIzaSyCjjaEuaQMiQxgkUQLlZmGfZEOxRonx9vQ';
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
            
            document.getElementById('result').textContent = 'Testing...\n\nURL: ' + url;
            
            try {
                const response = await fetch(`${url}?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: 'Say hello in one word'
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 10,
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    document.getElementById('result').textContent = 
                        '❌ ERROR:\n\n' + 
                        'Status: ' + response.status + '\n' +
                        'Error: ' + JSON.stringify(error, null, 2);
                    return;
                }

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                
                document.getElementById('result').textContent = 
                    '✅ SUCCESS!\n\n' +
                    'Model: gemini-flash-latest\n' +
                    'Response: ' + text + '\n\n' +
                    'Full response:\n' + JSON.stringify(data, null, 2);
                    
            } catch (error) {
                document.getElementById('result').textContent = 
                    '❌ ERROR:\n\n' + error.message;
            }
        }
    </script>
</body>
</html>
